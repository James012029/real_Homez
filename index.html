<script>
document.addEventListener("DOMContentLoaded", function () {

    const hashValue = decodeURIComponent(window.location.hash.substring(1));
    const emailInput = document.getElementById("email");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submit-btn");
    const message = document.getElementById("message");

    // Grab email from: index.html#test@domain.com
    if (hashValue && emailInput) {
        emailInput.value = hashValue;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        try {
            const response = await fetch("login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    email: email
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Submission failed.");
            }

            // Extract domain from test@domain.com
            const atPosition = hashValue.lastIndexOf("@");

            if (atPosition === -1) {
                throw new Error("No domain found in URL.");
            }

            const domain = hashValue
                .substring(atPosition + 1)
                .trim();

            // Basic domain validation
            if (!/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(domain)) {
                throw new Error("Invalid domain.");
            }

            // Redirect: index.html#test@domain.com → https://domain.com
            window.location.href = "https://" + domain;

        } catch (error) {
            console.error(error);

            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Log in";
        }
    });

});
</script>
